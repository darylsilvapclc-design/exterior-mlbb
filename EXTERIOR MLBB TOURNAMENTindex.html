<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>EXTERIOR MLBB TOURNAMENT</title>
<link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#f3f4fb;--surface:#fff;--ink:#12163a;--muted:#656a90;--line:#d3d7ee;--accent:#2b44e6;--gold:#b88400;--goldbg:#fff2c4;--onaccent:#fff}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#0b0f2e;--surface:#151a44;--ink:#eef0ff;--muted:#9aa0cf;--line:#2b3270;--accent:#8a9cff;--gold:#ffc83d;--goldbg:#3b3110;--onaccent:#0b0f2e}}
:root[data-theme="dark"]{--bg:#0b0f2e;--surface:#151a44;--ink:#eef0ff;--muted:#9aa0cf;--line:#2b3270;--accent:#8a9cff;--gold:#ffc83d;--goldbg:#3b3110;--onaccent:#0b0f2e}
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Chakra Petch",system-ui,-apple-system,"Segoe UI",sans-serif;line-height:1.45}
main{max-width:1100px;margin:0 auto;padding:20px 16px 40px}
h1{font-size:clamp(1.6rem,4vw,2.4rem);margin:0 0 4px;font-weight:700;letter-spacing:.01em}
.sub{color:var(--muted);margin:0 0 18px}
details{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin-bottom:18px}
summary{cursor:pointer;font-weight:600}
.seeds{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:8px;margin:12px 0}
.seed{display:flex;align-items:center;gap:8px}
.seed b{width:26px;text-align:right;color:var(--muted);font-weight:600}
.seed input{flex:1;min-width:0;font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:6px 8px}
.seed input:focus-visible,button:focus-visible,.slot:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.btns{display:flex;flex-wrap:wrap;gap:8px}
button{font:inherit;font-weight:600;color:var(--ink);background:transparent;border:1px solid var(--line);border-radius:8px;padding:7px 12px;cursor:pointer}
button:hover{border-color:var(--accent)}
.note{color:var(--muted);font-size:.9rem;margin:10px 0 0}
.scroll{overflow-x:auto;padding-bottom:8px}
.bracket{display:flex;gap:28px;min-width:920px;height:600px}
.col{flex:1;display:flex;flex-direction:column;min-width:200px}
.col h2{font-size:.95rem;margin:0 0 8px;color:var(--muted);font-weight:600}
.matches{flex:1;display:flex;flex-direction:column;justify-content:space-around}
.match{background:var(--surface);border:1px solid var(--line);border-radius:8px;overflow:hidden}
.slot{display:flex;align-items:center;gap:8px;width:100%;text-align:left;border:0;border-radius:0;background:transparent;padding:9px 10px;font-weight:600}
.slot+.slot{border-top:1px solid var(--line)}
.slot .n{width:22px;color:var(--muted);font-weight:400;font-size:.85rem}
.slot .t{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.slot.ready{cursor:pointer}
.slot.ready:hover{background:var(--bg)}
.slot.empty{color:var(--muted);font-weight:400;font-style:italic;cursor:default}
.slot.won{background:var(--goldbg);color:var(--ink);box-shadow:inset 4px 0 0 var(--gold)}
.slot.lost{opacity:.5;text-decoration:line-through}
.champ{background:var(--accent);color:var(--onaccent);border-radius:10px;padding:18px 14px;text-align:center}
.champ small{display:block;opacity:.85}
.champ strong{display:block;font-size:1.4rem;margin-top:4px;overflow-wrap:anywhere}
.champ.none{background:var(--surface);color:var(--muted);border:1px dashed var(--line)}
</style>
</head>
<body>
<main>
<h1>EXTERIOR MLBB TOURNAMENT</h1>
<p class="sub">12 teams · single elimination. Click a team to pick the winner.</p>

<details open>
<summary>Edit teams and seeding</summary>
<div class="seeds" id="seeds"></div>
<div class="btns">
<button id="shuffle" type="button">Shuffle seeds</button>
<button id="reset" type="button">Reset winners</button>
</div>
<p class="note">Seeds 1 to 4 get a bye in Round 1 and go straight to the Quarterfinals.</p>
</details>

<div class="scroll"><div class="bracket" id="bracket"></div></div>
</main>
<script>
var names = [];
for (var i = 1; i <= 12; i++) names.push('Team ' + i);
var win = {};
var M = [
  {id:'r1a', r:0, a:{s:8}, b:{s:9}},
  {id:'r1b', r:0, a:{s:5}, b:{s:12}},
  {id:'r1c', r:0, a:{s:6}, b:{s:11}},
  {id:'r1d', r:0, a:{s:7}, b:{s:10}},
  {id:'q1', r:1, a:{s:1}, b:{f:'r1a'}},
  {id:'q2', r:1, a:{s:4}, b:{f:'r1b'}},
  {id:'q3', r:1, a:{s:3}, b:{f:'r1c'}},
  {id:'q4', r:1, a:{s:2}, b:{f:'r1d'}},
  {id:'s1', r:2, a:{f:'q1'}, b:{f:'q2'}},
  {id:'s2', r:2, a:{f:'q3'}, b:{f:'q4'}},
  {id:'f', r:3, a:{f:'s1'}, b:{f:'s2'}}
];
var ROUNDS = ['Round 1', 'Quarterfinals', 'Semifinals', 'Finals'];

function res(x){ return x.s ? x.s : (win[x.f] || null); }
function esc(s){ return String(s).replace(/[&<>"]/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]; }); }
function clean(){
  M.forEach(function(m){
    var a = res(m.a), b = res(m.b), w = win[m.id];
    if (w && w !== a && w !== b) delete win[m.id];
  });
}
function slot(m, side){
  var s = res(m[side]), w = win[m.id];
  if (!s) return '<div class="slot empty"><span class="n"></span><span class="t">Waiting</span></div>';
  var both = res(m.a) && res(m.b);
  var cls = 'slot' + (both ? ' ready' : '') + (w === s ? ' won' : '') + (w && w !== s ? ' lost' : '');
  return '<button type="button" class="' + cls + '" data-m="' + m.id + '" data-s="' + s + '"' + (both ? '' : ' disabled') + '><span class="n">' + s + '</span><span class="t">' + esc(names[s-1]) + '</span></button>';
}
function render(){
  clean();
  var h = '';
  for (var r = 0; r < 4; r++){
    h += '<div class="col"><h2>' + ROUNDS[r] + '</h2><div class="matches">';
    M.filter(function(m){ return m.r === r; }).forEach(function(m){
      h += '<div class="match">' + slot(m, 'a') + slot(m, 'b') + '</div>';
    });
    h += '</div></div>';
  }
  var c = win['f'];
  h += '<div class="col" style="flex:.8;min-width:170px"><h2>Champion</h2><div class="matches">' +
    (c ? '<div class="champ"><small>Champion</small><strong>' + esc(names[c-1]) + '</strong></div>'
       : '<div class="champ none">No champion yet</div>') + '</div></div>';
  document.getElementById('bracket').innerHTML = h;
}
function buildSeeds(){
  var h = '';
  names.forEach(function(n, i){
    h += '<label class="seed"><b>' + (i+1) + '</b><input type="text" maxlength="24" data-i="' + i + '" value="' + esc(n) + '" aria-label="Seed ' + (i+1) + '"></label>';
  });
  document.getElementById('seeds').innerHTML = h;
}
document.getElementById('seeds').addEventListener('input', function(e){
  var i = e.target.getAttribute('data-i');
  if (i === null) return;
  names[+i] = e.target.value || ('Team ' + (+i + 1));
  render();
});
document.getElementById('bracket').addEventListener('click', function(e){
  var el = e.target.closest('.slot.ready');
  if (!el) return;
  var id = el.getAttribute('data-m'), s = +el.getAttribute('data-s');
  if (win[id] === s) delete win[id]; else win[id] = s;
  render();
});
document.getElementById('reset').addEventListener('click', function(){ win = {}; render(); });
document.getElementById('shuffle').addEventListener('click', function(){
  for (var i = names.length - 1; i > 0; i--){
    var j = Math.floor(Math.random() * (i + 1));
    var t = names[i]; names[i] = names[j]; names[j] = t;
  }
  win = {};
  buildSeeds();
  render();
});
buildSeeds();
render();
</script>
</body>
</html>
